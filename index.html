<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Leather - Premium Sourcing Agency</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0f0d0b;
      color: #f3f4f6;
      overflow-x: hidden;
    }

    /* Interactive 3D Ambient Vector Background Grid */
    .bg-animation-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    /* Code-Generated Floating 3D Leather-Tone Shapes */
    .floating-shape {
      position: absolute;
      border-radius: 24% 76% 35% 65% / 49% 45% 55% 51%;
      background: linear-gradient(135deg, #78350f 0%, #451a03 100%);
      filter: blur(4px) drop-shadow(0 20px 40px rgba(0,0,0,0.7));
      opacity: 0.25;
      animation: morphAndFloat 22s infinite ease-in-out;
    }

    /* Representing an abstract structural Bag Shape */
    .shape-bag-1 {
      width: 280px;
      height: 240px;
      top: 15%;
      left: 5%;
      border-radius: 12px 12px 30px 30px;
      border-top: 15px solid #b45309;
      background: linear-gradient(135deg, #92400e 0%, #292524 100%);
      animation-duration: 25s;
    }

    /* Representing an abstract geometric Wallet / Clutch */
    .shape-wallet-1 {
      width: 200px;
      height: 130px;
      bottom: 25%;
      left: 10%;
      border-radius: 8px;
      transform: rotate(-15deg);
      background: linear-gradient(135deg, #b45309 0%, #1c1917 100%);
      border-left: 8px solid #d97706;
      animation-delay: -5s;
      animation-duration: 18s;
    }

    /* Representing a secondary curved luxury item */
    .shape-bag-2 {
      width: 250px;
      height: 250px;
      top: 30%;
      right: 5%;
      border-radius: 50% 50% 20% 20%;
      background: linear-gradient(135deg, #78350f 0%, #44403c 100%);
      border-bottom: 12px solid #b45309;
      animation-delay: -10s;
      animation-duration: 28s;
    }

    /* Small decorative accessory ring / belt element */
    .shape-ring-1 {
      width: 120px;
      height: 120px;
      bottom: 15%;
      right: 12%;
      border-radius: 50%;
      background: transparent;
      border: 18px solid #d97706;
      opacity: 0.15;
      animation-delay: -3s;
      animation-duration: 20s;
    }

    @keyframes morphAndFloat {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-40px) translateX(25px) rotate(8deg) scale(1.05); border-radius: 30% 70% 40% 60% / 50% 60% 40% 50%; }
      100% { transform: translateY(0px) rotate(0deg) scale(1); }
    }

    /* Main Content Layer */
    .main-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #f59e0b;
    }

    .market-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(217, 119, 6, 0.4);
      color: #f59e0b;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hero-section {
      text-align: center;
      max-width: 800px;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #a3a3a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 span {
      color: #d97706;
      -webkit-text-fill-color: initial;
    }

    .subtitle {
      font-size: 16px;
      color: #d4d4d8;
      line-height: 1.6;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Form Container styling */
    .form-card {
      width: 100%;
      max-width: 650px;
      background: rgba(26, 22, 19, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(217, 119, 6, 0.2);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      width: 100%;
      background: rgba(15, 13, 11, 0.7);
      border: 1px solid rgba(161, 161, 170, 0.25);
      border-radius: 8px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #d97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
    }

    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    .success-overlay {
      display: none;
      text-align: center;
      padding: 30px 10px;
    }

    .success-overlay h3 {
      color: #f59e0b;
      font-size: 24px;
      margin-bottom: 12px;
    }

    @media (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
      h1 {
        font-size: 32px;
      }
      .form-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Mathematical 3D Vector Background Elements -->
  <div class="bg-animation-container">
    <div class="floating-shape shape-bag-1"></div>
    <div class="floating-shape shape-wallet-1"></div>
    <div class="floating-shape shape-bag-2"></div>
    <div class="floating-shape shape-ring-1"></div>
  </div>

  <!-- Front UI Layer -->
  <div class="main-wrapper">
    <header>
      <div class="logo">BD Leather</div>
      <div class="market-badges">
        <span class="badge">UK</span>
        <span class="badge">USA</span>
        <span class="badge">FRANCE</span>
        <span class="badge">ITALY</span>
        <span class="badge">UAE</span>
      </div>
    </header>

    <section class="hero-section">
      <h1>Top-Quality <span>Finished Leather Goods</span> Sourcing</h1>
      <p class="subtitle">
        Connecting premium buyers across the UK, USA, France, Italy, and UAE directly to compliance-certified manufactured leather goods factories. Avoid intermediate margins.
      </p>
    </section>

    <main class="form-card">
      <div id="sourcingFormContainer">
        <form id="rfqForm" onsubmit="handleSubmit(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="buyerName">Full Name / Company</label>
              <input type="text" id="buyerName" required placeholder="e.g., London Leather Ltd">
            </div>
            <div class="form-group">
              <label for="buyerEmail">Corporate Email</label>
              <input type="email" id="buyerEmail" required placeholder="name@company.com">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="targetMarket">Your Location / Market</label>
              <select id="targetMarket" required>
                <option value="" disabled selected>Select your region</option>
                <option value="UK">United Kingdom (UK)</option>
                <option value="USA">United States (USA)</option>
                <option value="France">France</option>
                <option value="Italy">Italy</option>
                <option value="UAE">United Arab Emirates (UAE)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="productCategory">Product Category</label>
              <select id="productCategory" required>
                <option value="" disabled selected>Select product type</option>
                <option value="Bags">Premium Travel Bags & Handbags</option>
                <option value="Wallets">Minimalist & Classic Wallets</option>
                <option value="Footwear">Leather Footwear & Shoes</option>
                <option value="Accessories">Belts & Small Accessories</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="productQty">Estimated Target Quantity (MOQ)</label>
            <input type="number" id="productQty" min="100" required placeholder="Minimum 100 pieces per style">
          </div>

          <div class="form-group">
            <label for="productSpecs">Detailed Product Specifications & Requirements</label>
